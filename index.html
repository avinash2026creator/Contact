  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A2744">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Construction Crane Contact Management App">
<title>CraneCall</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* ═══════════════════════════════════════════════
     DESIGN SYSTEM
     Color: Steel + Safety Orange
     Type: System UI stack — fast load, legible outdoors
     Signature: Animated status pulse on Working cranes
  ═══════════════════════════════════════════════ */
  :root {
    --c-bg:        #0F1923;
    --c-surface:   #1A2744;
    --c-surface2:  #223157;
    --c-border:    #2E4175;
    --c-orange:    #FF6B2B;
    --c-orange-dk: #D94F10;
    --c-text:      #F0F4FF;
    --c-muted:     #8A9CC0;
    --c-success:   #22C55E;
    --c-warn:      #FACC15;
    --c-danger:    #EF4444;
    --c-info:      #38BDF8;
    --c-standby:   #94A3B8;
    --radius:      12px;
    --radius-lg:   18px;
    --font:        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --transition:  0.18s ease;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    background: var(--c-bg);
    color: var(--c-text);
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    max-width: 540px;
    margin: 0 auto;
    position: relative;
  }

  /* ── Scrollable content area ── */
  #app {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 80px;
  }

  /* ── Header ── */
  .header {
    background: var(--c-surface);
    border-bottom: 1px solid var(--c-border);
    padding: 14px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-back {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: var(--c-surface2);
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid var(--c-border);
    flex-shrink: 0;
    font-size: 20px;
  }
  .header-title {
    flex: 1;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-logo {
    font-size: 22px; font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--c-text);
    flex: 1;
  }
  .header-logo span { color: var(--c-orange); }

  /* ── Search bar ── */
  .search-wrap {
    padding: 12px 16px 8px;
    position: sticky;
    top: 61px;
    z-index: 90;
    background: var(--c-bg);
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--c-surface);
    border: 1.5px solid var(--c-border);
    border-radius: var(--radius);
    padding: 0 14px;
    height: 52px;
    transition: border-color var(--transition);
  }
  .search-box:focus-within { border-color: var(--c-orange); }
  .search-box .icon { font-size: 20px; flex-shrink: 0; color: var(--c-muted); }
  .search-box input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--c-text);
    font-size: 16px;
    font-family: var(--font);
  }
  .search-box input::placeholder { color: var(--c-muted); }
  #searchClear {
    background: none; border: none; cursor: pointer;
    color: var(--c-muted); font-size: 18px; padding: 4px;
    display: none;
  }

  /* ── Sync status bar ── */
  .sync-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px;
    font-size: 12px;
    color: var(--c-muted);
  }
  .sync-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--c-success);
    margin-right: 6px;
  }
  .sync-dot.offline { background: var(--c-warn); }
  .sync-btn {
    background: none; border: none; cursor: pointer;
    color: var(--c-orange); font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 5px;
    padding: 4px 0;
  }
  .sync-btn:active { opacity: 0.7; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin 1s linear infinite; }

  /* ── Dashboard stats ── */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 8px 16px 12px;
  }
  .stat-card {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: background var(--transition), border-color var(--transition);
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
  }
  .stat-card.working::before { background: var(--c-success); }
  .stat-card.standby::before { background: var(--c-standby); }
  .stat-card.breakdown::before { background: var(--c-danger); }
  .stat-card.maintenance::before { background: var(--c-warn); }
  .stat-card:active { background: var(--c-surface2); }
  .stat-card .stat-val {
    font-size: 32px; font-weight: 900;
    line-height: 1; letter-spacing: -1px;
    margin-bottom: 4px;
  }
  .stat-card.working .stat-val { color: var(--c-success); }
  .stat-card.standby .stat-val { color: var(--c-standby); }
  .stat-card.breakdown .stat-val { color: var(--c-danger); }
  .stat-card.maintenance .stat-val { color: var(--c-warn); }
  .stat-card .stat-label {
    font-size: 13px; color: var(--c-muted); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .stat-total {
    padding: 0 16px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .stat-total-num {
    font-size: 28px; font-weight: 900; letter-spacing: -1px;
    color: var(--c-orange);
  }
  .stat-total-label { font-size: 14px; color: var(--c-muted); }

  /* ── Section label ── */
  .section-label {
    padding: 4px 16px 10px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--c-muted);
    display: flex; align-items: center; justify-content: space-between;
  }
  .filter-chip {
    background: var(--c-surface); border: 1px solid var(--c-border);
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; cursor: pointer; color: var(--c-orange);
    font-weight: 600;
  }

  /* ── Crane cards ── */
  .crane-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .crane-card {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: 16px;
    cursor: pointer;
    display: flex; align-items: center; gap: 14px;
    transition: background var(--transition), border-color var(--transition);
    position: relative;
    overflow: hidden;
  }
  .crane-card:active { background: var(--c-surface2); border-color: var(--c-orange); }
  .crane-badge {
    background: var(--c-surface2);
    border: 1.5px solid var(--c-border);
    border-radius: 10px;
    padding: 8px 10px;
    min-width: 68px;
    text-align: center;
    flex-shrink: 0;
  }
  .crane-badge .badge-id {
    font-size: 13px; font-weight: 800; letter-spacing: 0.5px;
    color: var(--c-orange); display: block;
  }
  .crane-badge .badge-type {
    font-size: 11px; color: var(--c-muted); margin-top: 2px; display: block;
  }
  .crane-info { flex: 1; min-width: 0; }
  .crane-info-loc {
    font-size: 15px; font-weight: 600; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .crane-info-sub { font-size: 13px; color: var(--c-muted); }
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 20px; padding: 4px 10px; font-size: 12px; font-weight: 700;
    flex-shrink: 0;
  }
  .status-pill .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0;
  }
  .status-pill.working { background: rgba(34,197,94,0.15); color: var(--c-success); }
  .status-pill.working .pulse {
    background: var(--c-success);
    animation: pulse-anim 2s ease infinite;
  }
  .status-pill.standby { background: rgba(148,163,184,0.15); color: var(--c-standby); }
  .status-pill.standby .pulse { background: var(--c-standby); }
  .status-pill.breakdown { background: rgba(239,68,68,0.15); color: var(--c-danger); }
  .status-pill.breakdown .pulse { background: var(--c-danger); }
  .status-pill.maintenance { background: rgba(250,204,21,0.15); color: var(--c-warn); }
  .status-pill.maintenance .pulse { background: var(--c-warn); }
  @keyframes pulse-anim {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.4); }
  }
  .crane-card-arrow { color: var(--c-border); font-size: 18px; flex-shrink: 0; }

  /* ── Crane detail screen ── */
  .detail-hero {
    padding: 20px 16px 16px;
    background: var(--c-surface);
    border-bottom: 1px solid var(--c-border);
  }
  .detail-crane-id {
    font-size: 32px; font-weight: 900; letter-spacing: -1px;
    color: var(--c-orange); margin-bottom: 4px;
  }
  .detail-meta {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-top: 16px;
  }
  .detail-meta-item { }
  .detail-meta-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--c-muted); font-weight: 700; margin-bottom: 3px;
  }
  .detail-meta-val { font-size: 15px; font-weight: 600; }
  .detail-buttons {
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .role-btn {
    background: var(--c-surface);
    border: 1.5px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    cursor: pointer;
    display: flex; align-items: center; gap: 16px;
    transition: background var(--transition), border-color var(--transition);
    width: 100%;
  }
  .role-btn:active { background: var(--c-surface2); border-color: var(--c-orange); }
  .role-btn-icon { font-size: 32px; flex-shrink: 0; }
  .role-btn-content { flex: 1; text-align: left; }
  .role-btn-title {
    font-size: 18px; font-weight: 800; color: var(--c-text); margin-bottom: 3px;
  }
  .role-btn-sub { font-size: 13px; color: var(--c-muted); }
  .role-btn-count {
    background: var(--c-surface2); border: 1px solid var(--c-border);
    border-radius: 20px; padding: 4px 10px;
    font-size: 13px; font-weight: 700; color: var(--c-orange);
  }
  .role-btn-arrow { color: var(--c-muted); font-size: 20px; }
  .detail-remarks {
    margin: 0 16px 16px;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    padding: 14px;
    font-size: 14px;
    color: var(--c-muted);
  }
  .detail-remarks strong { color: var(--c-text); display: block; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── Contact list screen ── */
  .contact-list { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .contact-card {
    background: var(--c-surface);
    border: 1.5px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: 20px;
    cursor: pointer;
    display: flex; align-items: center; gap: 16px;
    transition: background var(--transition), border-color var(--transition);
  }
  .contact-card:active { background: var(--c-surface2); border-color: var(--c-success); }
  .contact-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--c-surface2), var(--c-border));
    border: 2px solid var(--c-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name {
    font-size: 18px; font-weight: 700; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contact-phone {
    font-size: 15px; color: var(--c-muted); display: flex; align-items: center; gap: 6px;
  }
  .contact-call-btn {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--c-success), #16A34A);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    box-shadow: 0 4px 15px rgba(34,197,94,0.3);
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .contact-card:active .contact-call-btn {
    transform: scale(0.95);
    box-shadow: 0 2px 8px rgba(34,197,94,0.2);
  }
  .no-phone {
    width: 52px; height: 52px;
    background: var(--c-surface2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    color: var(--c-muted);
  }
  .unavailable-msg {
    font-size: 13px;
    color: var(--c-danger);
    margin-top: 4px;
    font-style: italic;
  }

  /* ── Empty / error states ── */
  .empty-state {
    padding: 60px 16px;
    text-align: center;
    color: var(--c-muted);
  }
  .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 18px; color: var(--c-text); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }
  .error-banner {
    margin: 12px 16px;
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 14px;
    color: var(--c-danger);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .setup-banner {
    margin: 12px 16px;
    background: rgba(255,107,43,0.1);
    border: 1.5px dashed var(--c-orange);
    border-radius: var(--radius);
    padding: 14px;
    font-size: 13px;
    color: var(--c-orange);
    line-height: 1.6;
  }
  .setup-banner strong { display: block; font-size: 14px; margin-bottom: 6px; }
  .setup-banner code {
    background: rgba(255,107,43,0.1); border-radius: 4px;
    padding: 1px 5px; font-size: 12px; word-break: break-all;
  }

  /* ── Loading skeleton ── */
  .skeleton {
    background: linear-gradient(90deg, var(--c-surface) 25%, var(--c-surface2) 50%, var(--c-surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 8px;
    height: 80px;
    margin: 0 16px 10px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ── Bottom nav ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 540px;
    background: var(--c-surface);
    border-top: 1px solid var(--c-border);
    display: flex;
    z-index: 200;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px;
    padding: 10px 0;
    cursor: pointer;
    background: none; border: none;
    color: var(--c-muted);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    transition: color var(--transition);
  }
  .nav-btn .icon { font-size: 22px; }
  .nav-btn.active { color: var(--c-orange); }

  /* ── Search results ── */
  .search-result-crane { margin-bottom: 4px; }
  .search-result-person {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .search-result-person:active { background: var(--c-surface2); }
  .srp-icon { font-size: 24px; }
  .srp-info { flex: 1; }
  .srp-name { font-size: 15px; font-weight: 700; }
  .srp-role { font-size: 12px; color: var(--c-orange); font-weight: 600; }
  .srp-crane { font-size: 12px; color: var(--c-muted); margin-top: 2px; }
  .srp-phone { font-size: 13px; color: var(--c-muted); display: flex; align-items: center; gap: 5px; }

  /* ── Highlight ── */
  mark {
    background: rgba(255,107,43,0.3);
    color: var(--c-text);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ── Settings screen ── */
  .settings-section { padding: 16px; }
  .settings-section h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--c-muted); font-weight: 700; margin-bottom: 12px;
  }
  .settings-input {
    background: var(--c-surface);
    border: 1.5px solid var(--c-border);
    border-radius: var(--radius);
    padding: 14px;
    color: var(--c-text);
    font-size: 14px;
    width: 100%;
    font-family: var(--font);
    transition: border-color var(--transition);
    margin-bottom: 10px;
  }
  .settings-input:focus { outline: none; border-color: var(--c-orange); }
  .settings-btn {
    background: var(--c-orange);
    border: none;
    border-radius: var(--radius);
    padding: 14px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    width: 100%;
    cursor: pointer;
    font-family: var(--font);
    transition: background var(--transition);
  }
  .settings-btn:active { background: var(--c-orange-dk); }
  .settings-btn.secondary {
    background: var(--c-surface2);
    color: var(--c-text);
    border: 1px solid var(--c-border);
    margin-top: 8px;
  }
  .settings-btn.danger { background: rgba(239,68,68,0.2); color: var(--c-danger); border: 1px solid rgba(239,68,68,0.3); }
  .settings-info {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    padding: 14px;
    font-size: 13px;
    color: var(--c-muted);
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .settings-info code { color: var(--c-orange); font-size: 12px; word-break: break-all; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: 30px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ── Screen transitions ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── Divider ── */
  .divider { height: 1px; background: var(--c-border); margin: 4px 0; }
  .section-pad { padding: 8px 0 4px; }
</style>
</head>
<body>

<div id="app">
  <!-- HOME SCREEN -->
  <div class="screen active" id="screen-home">
    <div class="header">
      <div class="header-logo">Crane<span>Call</span></div>
      <button class="nav-btn" onclick="showSettings()" style="padding:0;width:40px;height:40px;background:var(--c-surface2);border-radius:10px;border:1px solid var(--c-border)">
        <span class="icon">⚙️</span>
      </button>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search crane, name, phone, location..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="searchClear" onclick="clearSearch()">✕</button>
      </div>
    </div>
    <div class="sync-bar">
      <div>
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncStatus">Loading...</span>
      </div>
      <button class="sync-btn" onclick="refreshData()">
        <span id="refreshIcon">🔄</span> Refresh
      </button>
    </div>

    <!-- Dashboard -->
    <div id="dashboardSection">
      <div class="stat-total">
        <div class="stat-total-num" id="totalCount">—</div>
        <div class="stat-total-label">Total Cranes</div>
      </div>
      <div class="stats-grid">
        <div class="stat-card working" onclick="filterByStatus('Working')">
          <div class="stat-val" id="countWorking">—</div>
          <div class="stat-label">⚙️ Working</div>
        </div>
        <div class="stat-card standby" onclick="filterByStatus('Standby')">
          <div class="stat-val" id="countStandby">—</div>
          <div class="stat-label">⏸ Standby</div>
        </div>
        <div class="stat-card breakdown" onclick="filterByStatus('Breakdown')">
          <div class="stat-val" id="countBreakdown">—</div>
          <div class="stat-label">🔴 Breakdown</div>
        </div>
        <div class="stat-card maintenance" onclick="filterByStatus('Maintenance')">
          <div class="stat-val" id="countMaintenance">—</div>
          <div class="stat-label">🔧 Maintenance</div>
        </div>

    <div class="section-label">
      <span id="listLabel">All Cranes</span>

  <!-- CRANE DETAIL SCREEN -->

  <!-- CONTACT SCREEN -->
  <div class="screen" id="screen-contact">
    <div class="header">

    </div>
    <div id="contactContent"></div>

  <!-- SETTINGS SCREEN -->
  <div class="screen" id="screen-settings">
    <div class="header">
      <div class="header-back" onclick="showScreen('home')">‹</div>
      <div class="header-title">Settings</div>
    </div>
    <div id="settingsContent"></div>
  </div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="navHome" onclick="showScreen('home')">
    <span class="icon">🏠</span>Home
  </button>
  <button class="nav-btn" id="navSearch" onclick="focusSearch()">
    <span class="icon">🔍</span>Search
  </button>
  <button class="nav-btn" id="navSettings" onclick="showSettings()">
    <span class="icon">⚙️</span>Settings
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   CraneCall – Construction Crane Contact PWA
   v1.0 | Avi | 2026
═══════════════════════════════════════════════ */

// ── Config ──────────────────────────────────────
const CACHE_KEY    = 'cranecall_data_v2';
const CONFIG_KEY   = 'cranecall_config';
const CACHE_TTL    = 5 * 60 * 1000; // 5 min auto-refresh

// Load config
function getConfig() {
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY)) || {}; } catch { return {}; }
}
function saveConfig(c) { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }

// ── State ─────────────────────────────────────
let craneData      = [];
let filteredData   = [];
let currentFilter  = null;
let screenHistory  = ['home'];
let currentCrane   = null;
let currentRole    = null;
let isOnline       = navigator.onLine;

// ── Sample data (fallback for demo) ───────────
const SAMPLE_DATA = [
  { Crane_ID:'CR-001', Location:'Block A – North Wing', Crane_Type:'Tower Crane', Capacity:'10T', Operator_Name:'Rajesh Kumar', Operator_Phone:'9876543210', Supervisor_Name:'Amit Sharma', Supervisor_Phone:'9876501234', Owner_Name:'ABC Cranes Pvt Ltd', Owner_Phone:'9876001234', Status:'Working', Remarks:'Regular maintenance done on 15 Aug' },
  { Crane_ID:'CR-002', Location:'Block B – Main Tower', Crane_Type:'Tower Crane', Capacity:'12T', Operator_Name:'Suresh Patel;Vikram Yadav', Operator_Phone:'9823456789;9834567890', Supervisor_Name:'Manoj Singh', Supervisor_Phone:'9812345678', Owner_Name:'Shree Cranes', Owner_Phone:'9800123456', Status:'Working', Remarks:'' },
  { Crane_ID:'CR-003', Location:'Basement Podium', Crane_Type:'Mobile Crane', Capacity:'30T', Operator_Name:'Deepak Verma', Operator_Phone:'9756123456', Supervisor_Name:'Ramesh Gupta', Supervisor_Phone:'9745001234', Owner_Name:'XYZ Equipment Co', Owner_Phone:'9701001234', Status:'Standby', Remarks:'Fuel check pending' },
  { Crane_ID:'CR-004', Location:'Block A – South', Crane_Type:'Crawler Crane', Capacity:'50T', Operator_Name:'Sanjay Nair', Operator_Phone:'9667891234', Supervisor_Name:'Amit Sharma', Supervisor_Phone:'9876501234', Owner_Name:'ABC Cranes Pvt Ltd', Owner_Phone:'9876001234', Status:'Breakdown', Remarks:'Hydraulic leak – service called' },
  { Crane_ID:'CR-005', Location:'Plant Area – Zone 3', Crane_Type:'Tower Crane', Capacity:'8T', Operator_Name:'Mahesh Tiwari', Operator_Phone:'9589001234', Supervisor_Name:'Pradeep Joshi', Supervisor_Phone:'9512301234', Owner_Name:'TechLift Solutions', Owner_Phone:'9500001234', Status:'Maintenance', Remarks:'Annual inspection ongoing' },
  { Crane_ID:'CR-006', Location:'Block C – Roof', Crane_Type:'Tower Crane', Capacity:'6T', Operator_Name:'Rakesh Yadav', Operator_Phone:'9423001234', Supervisor_Name:'Manoj Singh', Supervisor_Phone:'9812345678', Owner_Name:'Shree Cranes', Owner_Phone:'9800123456', Status:'Working', Remarks:'' },
];

// ── Cache ─────────────────────────────────────
function saveCache(data) {
  const obj = { data, ts: Date.now() };
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(obj)); } catch(e) {}
}
function loadCache() {
  try {
    const obj = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (obj && obj.data) return obj;
  } catch {}
  return null;
}

// ── Normalize phone ───────────────────────────
function normalizePhone(p) {
  if (!p) return '';
  let n = p.toString().replace(/[\s\-().+]/g, '');
  if (n.startsWith('91') && n.length === 12) n = n.slice(2);
  if (n.startsWith('+91')) n = n.slice(3);
  return n;
}

// ── Parse multi-contact fields ─────────────────
function parseMulti(str) {
  if (!str) return [];
  return str.split(/[;,|]/).map(s => s.trim()).filter(Boolean);
}

// ── Status helpers ─────────────────────────────
function statusClass(s) {
  if (!s) return 'standby';
  return s.toLowerCase().replace(/\s/g,'');
}

// ── Toast ─────────────────────────────────────
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ── Screen navigation ─────────────────────────
function showScreen(name, addHistory = true) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (addHistory && screenHistory[screenHistory.length - 1] !== name) {
    screenHistory.push(name);
  }
  // nav highlight
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (name === 'home') document.getElementById('navHome').classList.add('active');
  if (name === 'settings') document.getElementById('navSettings').classList.add('active');

  // Scroll to top
  document.getElementById('app').scrollTop = 0;
}
function goBack() {
  if (screenHistory.length > 1) {
    screenHistory.pop();
    const prev = screenHistory[screenHistory.length - 1];
    showScreen(prev, false);
  } else {
    showScreen('home', false);
  }
}
function focusSearch() {
  showScreen('home');
  setTimeout(() => {
    const inp = document.getElementById('searchInput');
    if (inp) inp.focus();
  }, 100);
  document.getElementById('navSearch').classList.add('active');
}

// ── Fetch from Google Apps Script ─────────────
async function fetchFromAPI() {
  const cfg = getConfig();
  if (!cfg.apiUrl) throw new Error('NO_API_URL');
  const url = cfg.apiUrl + '?action=getAll';
  const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json.data || json;
}

// ── Load data ─────────────────────────────────
async function loadData(force = false) {
  setSyncStatus('loading');
  const cached = loadCache();

  // Use cache if fresh and not forced
  if (!force && cached && (Date.now() - cached.ts < CACHE_TTL)) {
    craneData = cached.data;
    renderAll();
    setSyncStatus('cached', new Date(cached.ts));
    return;
  }

  if (!isOnline && cached) {
    craneData = cached.data;
    renderAll();
    setSyncStatus('offline', new Date(cached.ts));
    return;
  }

  try {
    const data = await fetchFromAPI();
    craneData = data;
    saveCache(data);
    renderAll();
    setSyncStatus('online');
  } catch (e) {
    if (cached) {
      craneData = cached.data;
      renderAll();
      setSyncStatus('offline', new Date(cached.ts));
      if (e.message !== 'NO_API_URL') {
        showToast('⚠️ Unable to refresh. Showing cached data.');
      }
    } else {
      // Load sample data with notice
      craneData = SAMPLE_DATA;
      renderAll();
      setSyncStatus('demo');
    }
  }
}

async function refreshData() {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('spinning');
  await loadData(true);
  icon.classList.remove('spinning');
  showToast('✓ Data refreshed');
}

// ── Sync status bar ────────────────────────────
function setSyncStatus(state, date) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncStatus');
  const fmt = (d) => d ? d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  switch(state) {
    case 'loading':
      dot.className = 'sync-dot offline';
      lbl.textContent = 'Syncing...'; break;
    case 'online':
      dot.className = 'sync-dot';
      lbl.textContent = '🟢 Synced · ' + fmt(new Date()); break;
    case 'cached':
      dot.className = 'sync-dot';
      lbl.textContent = '✓ Last synced: ' + fmt(date); break;
    case 'offline':
      dot.className = 'sync-dot offline';
      lbl.textContent = '🟠 Offline · ' + fmt(date); break;
    case 'demo':
      dot.className = 'sync-dot offline';
      lbl.textContent = '📋 Demo data – connect Google Sheet'; break;
  }
}

// ── Dashboard ─────────────────────────────────
function renderDashboard() {
  const counts = { Working:0, Standby:0, Breakdown:0, Maintenance:0 };
  craneData.forEach(c => {
    const s = c.Status || 'Standby';
    if (counts[s] !== undefined) counts[s]++;
  });
  document.getElementById('totalCount').textContent = craneData.length;
  document.getElementById('countWorking').textContent = counts.Working;
  document.getElementById('countStandby').textContent = counts.Standby;
  document.getElementById('countBreakdown').textContent = counts.Breakdown;
  document.getElementById('countMaintenance').textContent = counts.Maintenance;
}

// ── Crane List ────────────────────────────────
function renderCraneList(data, label) {
  const list = document.getElementById('craneList');
  document.getElementById('listLabel').textContent = label || ('All Cranes (' + data.length + ')');

  if (data.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🏗️</div><h3>No cranes found</h3><p>No cranes match the current filter.</p></div>';
    return;
  }

  list.innerHTML = data.map(c => {
    const sc = statusClass(c.Status);
    return `<div class="crane-card" onclick="openCrane('${escHtml(c.Crane_ID)}')">
      <div class="crane-badge">
        <span class="badge-id">${escHtml(c.Crane_ID)}</span>
        <span class="badge-type">${escHtml(shortType(c.Crane_Type))}</span>
      </div>
      <div class="crane-info">
        <div class="crane-info-loc">📍 ${escHtml(c.Location || '—')}</div>
        <div class="crane-info-sub">${escHtml(c.Capacity || '')} ${c.Capacity ? '·' : ''} ${escHtml(c.Crane_Type || '—')}</div>
      </div>
      <div class="status-pill ${sc}"><span class="pulse"></span>${escHtml(c.Status || 'Unknown')}</div>
      <span class="crane-card-arrow">›</span>
    </div>`;
  }).join('');
}

function shortType(t) {
  if (!t) return '—';
  if (t.includes('Tower')) return 'Tower';
  if (t.includes('Mobile')) return 'Mobile';
  if (t.includes('Crawler')) return 'Crawler';
  return t.slice(0,8);
}

function renderAll() {
  renderDashboard();
  const data = currentFilter
    ? craneData.filter(c => (c.Status||'').toLowerCase() === currentFilter.toLowerCase())
    : craneData;
  filteredData = data;
  renderCraneList(data, currentFilter ? `${currentFilter} Cranes (${data.length})` : null);
}

function filterByStatus(status) {
  currentFilter = status;
  document.getElementById('clearFilter').style.display = '';
  renderAll();
  document.getElementById('craneList').style.display = '';
  document.getElementById('searchResults').style.display = 'none';
  document.getElementById('dashboardSection').style.display = 'none';
}

function clearFilter() {
  currentFilter = null;
  document.getElementById('clearFilter').style.display = 'none';
  document.getElementById('dashboardSection').style.display = '';
  renderAll();
}

// ── Search ────────────────────────────────────
function setupSearch() {
  const inp = document.getElementById('searchInput');
  inp.addEventListener('input', () => {
    const q = inp.value.trim();
    document.getElementById('searchClear').style.display = q ? '' : 'none';
    if (!q) {
      document.getElementById('craneList').style.display = '';
      document.getElementById('searchResults').style.display = 'none';
      document.getElementById('dashboardSection').style.display = '';
      document.getElementById('clearFilter').style.display = currentFilter ? '' : 'none';
      document.getElementById('listLabel').textContent = currentFilter ? `${currentFilter} Cranes` : 'All Cranes';
      return;
    }
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('craneList').style.display = 'none';
    document.getElementById('searchResults').style.display = '';
    renderSearchResults(q);
  });
}

function clearSearch() {
  const inp = document.getElementById('searchInput');
  inp.value = '';
  inp.dispatchEvent(new Event('input'));
  inp.focus();
}

function renderSearchResults(q) {
  const ql = q.toLowerCase();
  const container = document.getElementById('searchResults');
  const craneMatches = [];
  const personMatches = [];

  craneData.forEach(c => {
    const ops = parseMulti(c.Operator_Name);
    const opPh = parseMulti(c.Operator_Phone);
    const sups = parseMulti(c.Supervisor_Name);
    const supPh = parseMulti(c.Supervisor_Phone);
    const own = parseMulti(c.Owner_Name);
    const ownPh = parseMulti(c.Owner_Phone);

    const allText = [c.Crane_ID, c.Location, c.Crane_Type, c.Status, c.Remarks,
      ...ops, ...opPh, ...sups, ...supPh, ...own, ...ownPh].join(' ').toLowerCase();

    if (!allText.includes(ql)) return;

    const isCraneMatch = [c.Crane_ID, c.Location, c.Crane_Type, c.Status].join(' ').toLowerCase().includes(ql);
    if (isCraneMatch) craneMatches.push(c);

    // Person matches
    ops.forEach((name, i) => {
      const ph = opPh[i] || '';
      if ((name + ph).toLowerCase().includes(ql)) {
        personMatches.push({ name, phone: ph, role:'Operator', craneId: c.Crane_ID, location: c.Location });
      }
    });
    sups.forEach((name, i) => {
      const ph = supPh[i] || '';
      if ((name + ph).toLowerCase().includes(ql)) {
        personMatches.push({ name, phone: ph, role:'Supervisor', craneId: c.Crane_ID, location: c.Location });
      }
    });
    own.forEach((name, i) => {
      const ph = ownPh[i] || '';
      if ((name + ph).toLowerCase().includes(ql)) {
        personMatches.push({ name, phone: ph, role:'Owner', craneId: c.Crane_ID, location: c.Location });
      }
    });
  });

  let html = '';
  if (craneMatches.length === 0 && personMatches.length === 0) {
    html = `<div class="empty-state"><div class="icon">🔍</div><h3>No results</h3><p>No cranes or contacts match "<strong>${escHtml(q)}</strong>"</p></div>`;
  } else {
    if (craneMatches.length > 0) {
      html += `<div class="section-label">Cranes (${craneMatches.length})</div>`;
      html += '<div class="crane-list" style="padding:0;margin-bottom:16px;">';
      craneMatches.forEach(c => {
        const sc = statusClass(c.Status);
        html += `<div class="crane-card" onclick="openCrane('${escHtml(c.Crane_ID)}')">
          <div class="crane-badge"><span class="badge-id">${highlight(c.Crane_ID, q)}</span><span class="badge-type">${escHtml(shortType(c.Crane_Type))}</span></div>
          <div class="crane-info">
            <div class="crane-info-loc">📍 ${highlight(c.Location || '—', q)}</div>
            <div class="crane-info-sub">${highlight(c.Crane_Type || '', q)}</div>
          </div>
          <div class="status-pill ${sc}"><span class="pulse"></span>${escHtml(c.Status||'')}</div>
          <span class="crane-card-arrow">›</span>
        </div>`;
      });
      html += '</div>';
    }
    if (personMatches.length > 0) {
      html += `<div class="section-label">People (${personMatches.length})</div>`;
      personMatches.forEach(p => {
        const icon = p.role === 'Operator' ? '👷' : p.role === 'Supervisor' ? '🦺' : '🏢';
        html += `<div class="search-result-person" onclick="openCraneAndRole('${escHtml(p.craneId)}','${escHtml(p.role)}')">
          <div class="srp-icon">${icon}</div>
          <div class="srp-info">
            <div class="srp-name">${highlight(p.name, q)}</div>
            <div class="srp-role">${p.role}</div>
            <div class="srp-crane">${p.craneId} · 📍 ${p.location}</div>
          </div>
          ${p.phone ? `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
            <div class="srp-phone">📞 ${highlight(p.phone, q)}</div>
            <a href="tel:${escHtml(normalizePhone(p.phone))}" onclick="event.stopPropagation()" style="background:var(--c-success);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;">Call</a>
          </div>` : ''}
        </div>`;
      });
    }
  }
  container.innerHTML = html;
  document.getElementById('listLabel').textContent = `Results for "${q}"`;
}

function highlight(text, q) {
  if (!q || !text) return escHtml(text || '');
  const re = new RegExp('(' + escRegex(q) + ')', 'gi');
  return escHtml(text).replace(re, '<mark>$1</mark>');
}

// ── Crane Detail ───────────────────────────────
function openCrane(craneId) {
  currentCrane = craneData.find(c => c.Crane_ID === craneId);
  if (!currentCrane) { showToast('Crane not found'); return; }

  document.getElementById('detailTitle').textContent = craneId;
  const c = currentCrane;
  const sc = statusClass(c.Status);
  const ops = parseMulti(c.Operator_Name);
  const sups = parseMulti(c.Supervisor_Name);
  const own = parseMulti(c.Owner_Name);

  const opNames = ops.join(', ') || 'Not assigned';
  const supNames = sups.join(', ') || 'Not assigned';
  const ownNames = own.join(', ') || 'Not assigned';

  let html = `
    <div class="detail-hero">
      <div class="detail-crane-id">${escHtml(c.Crane_ID)}</div>
      <div style="margin-top:6px">
        <div class="status-pill ${sc}" style="display:inline-flex;"><span class="pulse"></span>${escHtml(c.Status||'Unknown')}</div>
      </div>
      <div class="detail-meta">
        <div class="detail-meta-item">
          <div class="detail-meta-label">📍 Location</div>
          <div class="detail-meta-val">${escHtml(c.Location||'—')}</div>
        </div>
        <div class="detail-meta-item">
          <div class="detail-meta-label">🏗 Type</div>
          <div class="detail-meta-val">${escHtml(c.Crane_Type||'—')}</div>
        </div>
        <div class="detail-meta-item">
          <div class="detail-meta-label">⚖️ Capacity</div>
          <div class="detail-meta-val">${escHtml(c.Capacity||'—')}</div>
        </div>
      </div>
    </div>
    <div class="detail-buttons">
      <button class="role-btn" onclick="openRole('Operator')">
        <span class="role-btn-icon">👷</span>
        <div class="role-btn-content">
          <div class="role-btn-title">Operator</div>
          <div class="role-btn-sub">${escHtml(opNames)}</div>
        </div>
        <span class="role-btn-count">${ops.filter(Boolean).length}</span>
        <span class="role-btn-arrow">›</span>
      </button>
      <button class="role-btn" onclick="openRole('Supervisor')">
        <span class="role-btn-icon">🦺</span>
        <div class="role-btn-content">
          <div class="role-btn-title">Supervisor</div>
          <div class="role-btn-sub">${escHtml(supNames)}</div>
        </div>
        <span class="role-btn-count">${sups.filter(Boolean).length}</span>
        <span class="role-btn-arrow">›</span>
      </button>
      <button class="role-btn" onclick="openRole('Owner')">
        <span class="role-btn-icon">🏢</span>
        <div class="role-btn-content">
          <div class="role-btn-title">Owner</div>
          <div class="role-btn-sub">${escHtml(ownNames)}</div>
        </div>
        <span class="role-btn-count">${own.filter(Boolean).length}</span>
        <span class="role-btn-arrow">›</span>
      </button>
    </div>`;

  if (c.Remarks) {
    html += `<div class="detail-remarks"><strong>Remarks</strong>${escHtml(c.Remarks)}</div>`;
  }

  document.getElementById('detailContent').innerHTML = html;
  showScreen('detail');
}

function openCraneAndRole(craneId, role) {
  openCrane(craneId);
  setTimeout(() => openRole(role), 50);
}

// ── Contact Screen ─────────────────────────────
function openRole(role) {
  if (!currentCrane) return;
  currentRole = role;
  const c = currentCrane;

  let names, phones, icon;
  if (role === 'Operator') {
    names = parseMulti(c.Operator_Name);
    phones = parseMulti(c.Operator_Phone);
    icon = '👷';
  } else if (role === 'Supervisor') {
    names = parseMulti(c.Supervisor_Name);
    phones = parseMulti(c.Supervisor_Phone);
    icon = '🦺';
  } else {
    names = parseMulti(c.Owner_Name);
    phones = parseMulti(c.Owner_Phone);
    icon = '🏢';
  }

  document.getElementById('contactTitle').textContent = role + ' — ' + c.Crane_ID;

  let html = `<div class="contact-list">`;
  if (names.length === 0 || (names.length === 1 && !names[0])) {
    html += `<div class="empty-state"><div class="icon">${icon}</div><h3>No ${role.toLowerCase()} assigned</h3><p>No ${role.toLowerCase()} has been assigned to ${c.Crane_ID} yet.</p></div>`;
  } else {
    names.forEach((name, i) => {
      const rawPhone = phones[i] || '';
      const phone = normalizePhone(rawPhone);
      const displayPhone = rawPhone || '';
      const hasPhone = !!phone;

      if (!name) return;
      html += `
        <div class="contact-card" onclick="${hasPhone ? `makeCall('${phone}')` : ''}">
          <div class="contact-avatar">${icon}</div>
          <div class="contact-info">
            <div class="contact-name">${escHtml(name)}</div>
            <div class="contact-phone">${hasPhone ? '📞 ' + escHtml(displayPhone) : '<span class="unavailable-msg">Contact number unavailable</span>'}</div>
          </div>
          ${hasPhone
            ? `<a href="tel:${phone}" onclick="event.stopPropagation()" class="contact-call-btn">📞</a>`
            : `<div class="no-phone">—</div>`}
        </div>`;
    });
  }
  html += `</div>`;

  document.getElementById('contactContent').innerHTML = html;
  showScreen('contact');
}

function makeCall(phone) {
  if (!phone) return;
  window.location.href = 'tel:' + phone;
}

// ── Settings ────────────────────────────────────
function showSettings() {
  const cfg = getConfig();
  const cached = loadCache();
  const hasDemoData = !cfg.apiUrl;

  let html = `
    <div class="settings-section">
      <h3>Google Apps Script API</h3>
      <div class="settings-info">
        Deploy your Google Apps Script as a Web App, then paste the URL below.<br><br>
        The URL looks like:<br>
        <code>https://script.google.com/macros/s/AKfycbxqgTlfbfvomgJ--yCqx4tsGIWR9ugab6eNILJGn7-hnNePoc3Al7pR193g-7n_Bi57/exec</code>
      </div>
      <input class="settings-input" id="apiUrlInput" type="url" placeholder="https://script.google.com/macros/s/AKfycbxqgTlfbfvomgJ--yCqx4tsGIWR9ugab6eNILJGn7-hnNePoc3Al7pR193g-7n_Bi57/exec" value="${escHtml(cfg.apiUrl || '')}">
      <button class="settings-btn" onclick="saveApiUrl()">💾 Save & Connect</button>
      <button class="settings-btn secondary" onclick="testApiUrl()">🔗 Test Connection</button>
    </div>
    <div class="divider" style="margin:0 16px;"></div>
    <div class="settings-section">
      <h3>Data</h3>
      <button class="settings-btn secondary" onclick="refreshData();showToast('Refreshing...')">🔄 Refresh Data Now</button>
      <button class="settings-btn danger" style="margin-top:8px" onclick="clearAllData()">🗑 Clear All Cached Data</button>
      ${cached ? `<p style="color:var(--c-muted);font-size:13px;margin-top:10px">Cached: ${cached.data.length} cranes · ${new Date(cached.ts).toLocaleDateString('en-IN')}</p>` : ''}
    </div>
    <div class="divider" style="margin:0 16px;"></div>
    <div class="settings-section">
      <h3>About</h3>
      <div class="settings-info" style="font-size:12px;line-height:1.8;">
        <strong>CraneCall v1.0</strong><br>
        Construction Crane Contact Management<br><br>
        📱 Install as PWA: tap browser menu → "Add to Home Screen"<br>
        📶 Works offline using cached data<br>
        📞 Tap any contact to call instantly
      </div>
    </div>
    ${hasDemoData ? `<div class="setup-banner" style="margin-bottom:16px;">
      <strong>⚙️ Demo Mode – Setup Required</strong>
      You're viewing sample data. Connect your Google Sheet to get live crane data.<br><br>
      See <code>setup-guide.md</code> for step-by-step instructions.
    </div>` : ''}
  `;
  document.getElementById('settingsContent').innerHTML = html;
  showScreen('settings');
}

function saveApiUrl() {
  const val = document.getElementById('apiUrlInput').value.trim();
  const cfg = getConfig();
  cfg.apiUrl = val;
  saveConfig(cfg);
  showToast(val ? '✓ API URL saved' : 'API URL cleared');
  if (val) { refreshData(); goBack(); }
}

async function testApiUrl() {
  const val = document.getElementById('apiUrlInput').value.trim();
  if (!val) { showToast('⚠️ Enter a URL first'); return; }
  try {
    showToast('Testing connection...');
    const res = await fetch(val + '?action=ping', { signal: AbortSignal.timeout(8000) });
    const j = await res.json();
    showToast('✅ Connection OK · ' + (j.count || '?') + ' cranes');
  } catch(e) {
    showToast('❌ Connection failed: ' + e.message);
  }
}

function clearAllData() {
  if (!confirm('Clear all cached crane data?')) return;
  localStorage.removeItem(CACHE_KEY);
  craneData = SAMPLE_DATA;
  renderAll();
  showToast('Cache cleared. Showing demo data.');
  showScreen('home');
}

// ── Utilities ──────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ── Online/offline events ──────────────────────
window.addEventListener('online', () => { isOnline = true; loadData(true); });
window.addEventListener('offline', () => {
  isOnline = false;
  setSyncStatus('offline', new Date(loadCache()?.ts));
});

// ── Service Worker ─────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── QR code deep link ─────────────────────────
function handleDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const craneId = params.get('crane');
  if (craneId) {
    // Wait for data to load then open crane
    const tryOpen = setInterval(() => {
      if (craneData.length > 0) {
        clearInterval(tryOpen);
        openCrane(craneId);
      }
    }, 200);
    setTimeout(() => clearInterval(tryOpen), 5000);
  }
}

// ── Init ───────────────────────────────────────
function init() {
  setupSearch();
  loadData();
  setTimeout(handleDeepLink, 300);
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
